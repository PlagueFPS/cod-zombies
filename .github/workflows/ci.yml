name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  quality:
    name: Check, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Check
        run: vp run check

      - name: Install Playwright Browsers
        run: vp exec playwright install --with-deps chromium

      - name: Unit Tests
        run: vp test

      - name: E2E Tests
        run: vp run test:e2e
